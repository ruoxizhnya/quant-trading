# AUD-58 的 e2e 专用覆盖层 —— **绝不要在任何真实环境用这个文件**。
#
# 为什么需要它：网关限流是 `100 req/min per ClientIP`，而整套 playwright 从
# `127.0.0.1` **一个 IP** 出量，API 密集的那几段必然越过额度 —— 于是一批与被测
# 代码无关的用例拿到 429（实测 11 ~ 27 条，取决于是否有别的套件同时在打同一个 API）。
# 这条缺陷 2026-09-25 就是靠「临时把额度提到 100000 再重跑整套」分离出来的。
#
# 用法：
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml \
#     up -d --force-recreate --no-deps analysis-service data-service
#   （然后正常跑 e2e）
#
# 恢复默认姿势（限流 100）：
#   docker compose up -d --force-recreate --no-deps analysis-service data-service
#
# 基础文件 docker-compose.yml 里的缺省值**一个字没动**：本地开发的默认仍然是一个
# 真实的限额。抬高额度只发生在这一层，且是显式的、可 review 的、可一键撤销的。
#
# ⚠️ 代价（写出来，免得被当成没代价）：在这个姿势下 e2e **不再覆盖**「限流生效」。
# 限流本身由两处守：
#   - cmd/analysis/rate_limit_exempt_test.go —— 含**对照组腿**（/api/strategies
#     仍必须被限）与**窄度腿**（POST /api/auth/login 仍必须被限）；
#   - cmd/analysis/rate_limit_budget_test.go —— 证明 RATE_LIMIT_PER_MINUTE
#     这个旋钮真的接上了（否则这里的「高额度」就是个安慰剂），且**默认值不许被调高**
#     （调高默认等于把限流从本地开发里静默删掉）。

services:
  analysis-service:
    environment:
      RATE_LIMIT_PER_MINUTE: "100000"

  data-service:
    environment:
      RATE_LIMIT_PER_MINUTE: "100000"
