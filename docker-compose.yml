version: '3.9'

# P1-15 (Sprint 6, ODR-021): service count reduced from 7 to 5.
# The risk and execution services have been merged into the
# analysis service (in-process), so docker-compose no longer
# builds/boots them as separate containers. Their HTTP endpoints
# (under /api/risk/* and /api/execution/*) are served by
# analysis-service:8085.
#
# Remaining services:
#   - postgres (5432)         — TS DB
#   - redis (6379)            — cache / session / sync_job_cache
#   - data-service (8081)     — multi-source data ingestion
#   - strategy-service (8082) — strategy registry (standby per ADR-012)
#   - analysis-service (8085) — backtest + risk + execution + auth
#
# 端口绑定约定（AUD-13）：**postgres / redis 只绑 127.0.0.1** —— 数据库与
# 缓存不该出现在局域网上（Redis 还没有密码）。应用服务保持 0.0.0.0，它们
# 本来就是要被访问的。这条约定由 tools/check_deploy_consistency.py 守护。
#
# (ai-service 已删除：2026-09-18，TASKS P2-5。它零调用方且建在待废弃的
# pkg/ai/agents 上；AI 能力现在走 cmd/analysis 的 MCP 工具层。)

services:
  postgres:
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_USER: postgres
      # AUD-39：读的是 **DATABASE_PASSWORD**，与应用侧同一个变量。
      # 此前这里写的是 ${DB_PASSWORD:-postgres} —— 与应用读的
      # ${DATABASE_PASSWORD:-postgres} 是**两个独立的变量**，只是默认值
      # 恰好相同。一旦有人把密码改成非默认（改哪个都错），postgres 与
      # 应用就会用不同的密码，连接必然失败。ADR-017 与 SPEC.md 里写的
      # `DB_PASSWORD` 是第三个口径，已一并订正。
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: quant_trading
    ports:
      # AUD-13：数据库只绑回环，不暴露到局域网。
      # 容器之间走 compose 网络的服务名（postgres:5432），与本映射无关；
      # 宿主机上的 psql 与测试 DSN（localhost:5432）照旧通 —— localhost 就是
      # 127.0.0.1，所以这是「收紧到本机」而不是「关掉」。
      # 应用服务的端口有意保持 0.0.0.0（见文件头）：它们本来就是要被访问的。
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      # AUD-13：同上，只绑回环。⚠️ 本服务的 Redis **没有 requirepass**，
      # 绑到 0.0.0.0 等于把无鉴权缓存交给整个局域网；绑回环是当前唯一
      # 有效的访问控制。（给 Redis 加密码要动全部服务的 REDIS_URL，
      # 是另一件事 —— 见 TASKS.md「AUD-13 落地说明」。）
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  data-service:
    build:
      context: .
      dockerfile: Dockerfile.service
    command: ["/app/data-service"]
    ports:
      - "8081:8081"
    environment:
      # AUD-39：DATABASE_HOST/PORT/USER/DATABASE 四项此前**没给** data-service
      # （只给了密码），它靠 config/data-service.yaml 里的 host/port/user/
      # database 兜底 —— 值恰好与这里相同，所以「碰巧能用」（P1-8 同型：
      # 一旦 yaml 或服务名改了就会静默连错库）。显式补齐，与
      # analysis-service 的口径一致。
      #
      # DB_PASSWORD 已删除：viper 的键是 database.password，推导出的 env 名
      # 是 DATABASE_PASSWORD；DB_PASSWORD 零读取者（与 k8s 侧
      # POSTGRES_PASSWORD 是同一类死键）。
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_DATABASE: quant_trading
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN}
      REDIS_URL: redis://redis:6379
      # AUD-35：名字必须是 LOGGING_LEVEL。viper 的 AutomaticEnv +
      # SetEnvKeyReplacer(".", "_") 把 logging.level 映射成 LOGGING_LEVEL；
      # 此前这里写的 LOG_LEVEL 全仓无人读（死配置）—— 改了没有任何效果。
      LOGGING_LEVEL: info
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  strategy-service:
    build:
      context: .
      dockerfile: Dockerfile.service
    command: ["/app/strategy-service"]
    ports:
      - "8082:8082"
    environment:
      REDIS_URL: redis://redis:6379
      DATA_SERVICE_URL: http://data-service:8081
      LOGGING_LEVEL: info
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
      data-service:
        condition: service_healthy

  analysis-service:
    build:
      context: .
      dockerfile: Dockerfile.service
    entrypoint: ["/app/analysis-service"]
    ports:
      - "8085:8085"
    environment:
      # AUD-39：DB_PASSWORD 已删除（零读取者，viper 读的是
      # database.password → DATABASE_PASSWORD，见 postgres 服务的说明）。
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      # P0-4: 鉴权密钥，必须设置。容器里监听 0.0.0.0，不配密钥服务会
      # 拒绝启动（`auth: JWT secret missing`）—— 这是刻意的 fail-closed。
      # 生成：openssl rand -hex 32
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required (generate it with: openssl rand -hex 32)}"
      # 跨源白名单，逗号分隔。留空 = 不回显任何 ACAO（默认，最安全）。
      # 需要让独立部署的 SPA 直连时再填，例如：
      # SERVER_CORS_ALLOWED_ORIGINS: http://localhost:5173
      SERVER_CORS_ALLOWED_ORIGINS: ${SERVER_CORS_ALLOWED_ORIGINS:-}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_DATABASE: quant_trading
      REDIS_URL: redis://redis:6379
      DATA_SERVICE_URL: http://data-service:8081
      STRATEGY_SERVICE_URL: http://strategy-service:8082
      # P1-15 (Sprint 6, ODR-021): risk + execution merged into
      # analysis. RISK_SERVICE_URL kept as a legacy fallback only
      # — the engine prefers the in-process risk manager
      # attached via WithRiskManager. STRATEGY_SERVICE_URL is
      # still used as an external fallback if the in-process
      # registry doesn't have the requested strategy.
      AI_API_KEY: ${AI_API_KEY:-}
      AI_API_URL: ${AI_API_URL:-https://api.openai.com/v1/chat/completions}
      LOGGING_LEVEL: info
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8085/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      data-service:
        condition: service_healthy

  web:
    # AUD-32：官方前端（web/，Vue 3 + Vite）的构建与托管。
    # 之前它只能 `npm run dev` 跑在 :5173，compose 里连个服务都没有 ——
    # 于是 cmd/analysis/static/ 那套 legacy HTML 成了唯一的服务端 UI
    # （ODR-062 取证 e），想删也删不掉（AUD-33 卡在这里）。
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      # AUD-13：应用服务有意绑 0.0.0.0 —— 前端本来就是要被浏览器打开的。
      # 只有 postgres / redis 该绑回环（那条由 check_deploy_consistency.py 守）。
      - "8080:8080"
    depends_on:
      # nginx 里 /api 反代到 analysis-service:8085。用 resolver + 变量
      # 写法（见 deploy/nginx-spa.conf），后端晚起来也不会让 nginx 启动失败，
      # 但 depends_on 仍然要写：它保证 /health 探针打过去时后端已经在听。
      analysis-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
  redis_data:
