openapi: 3.0.3
info:
  title: Quant Lab Analysis Service API
  version: 1.0.0
  description: |
    A-share quantitative trading platform REST API.

    The Analysis Service acts as the API gateway, coordinating backtest,
    strategy, data, risk, execution, compliance, and AI research endpoints.

    ## Authentication
    Most endpoints are open in dev mode. When `auth.jwt_secret` is configured,
    protected endpoints require a `Bearer` JWT token obtained via `POST /api/auth/login`.

    ## Conventions
    - All dates use `YYYY-MM-DD` unless noted otherwise.
    - Monetary values are in CNY (Chinese Yuan).
    - Symbols follow the `XXXXXX.SH` / `XXXXXX.SZ` convention.
  contact:
    name: Quant Lab
    url: https://github.com/ruoxizhnya/quant-trading
  license:
    name: MIT

servers:
  - url: http://localhost:8085
    description: Local development server
  - url: http://analysis-service:8085
    description: Docker compose internal URL

tags:
  - name: Health
    description: Service health and metrics endpoints
  - name: Backtest
    description: Backtest execution, reports, and comparison
  - name: WalkForward
    description: Walk-forward validation
  - name: Batch
    description: Batch backtest execution
  - name: Strategies
    description: Strategy configuration CRUD
  - name: Datasource
    description: Market data source management
  - name: Plugins
    description: Strategy plugin hot-loading
  - name: Factor
    description: Factor analysis and IC computation
  - name: Copilot
    description: AI-driven strategy generation
  - name: AI Pipeline
    description: AI strategy generation pipeline
  - name: Auth
    description: Authentication and user management
  - name: Risk
    description: Position sizing, regime detection, stop-loss
  - name: Execution
    description: Order submission, positions, account, kill-switch
  - name: Compliance
    description: Investor suitability, abnormal-trade, large-trade reports
  - name: Alerts
    description: Risk alert history and stats
  - name: Data Proxy
    description: Proxied data-service endpoints (OHLCV, screen, calendar)
  - name: Evidence
    description: L0 evidence service — resolves a citation's content_hash to its archived source response
  - name: Industry
    description: Industry-chain static data layer (P2-2) — SW industry tree, supply-chain edges, industry vitality, ETF constituents
  - name: Macro
    description: Domestic macro indicator layer (P2-1) — CPI/PPI/PMI/M2/社融/LPR/汇率 observations from Tushare (0 new keys)

paths:
  # ============================================================
  # Health
  # ============================================================
  /health:
    get:
      tags: [Health]
      summary: Service health check
      description: Returns the current health status of the analysis service.
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /metrics:
    get:
      tags: [Health]
      summary: Prometheus metrics
      description: Exposes the four ADR-017 core metrics plus Go runtime collectors.
      operationId: getMetrics
      responses:
        '200':
          description: Prometheus-format metrics
          content:
            text/plain:
              schema:
                type: string

  /api/v1:
    get:
      tags: [Health]
      summary: API version info
      description: Returns service name, version, and a list of available endpoints.
      operationId: getApiVersion
      responses:
        '200':
          description: API version information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiVersionInfo'

  # ============================================================
  # Backtest
  # ============================================================
  /api/backtest:
    get:
      tags: [Backtest]
      summary: List backtest jobs
      description: Returns the most recent backtest jobs.
      operationId: listBacktests
      parameters:
        - name: limit
          in: query
          description: Maximum number of jobs to return (1-100, default 20).
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: List of backtest jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: '#/components/schemas/BacktestJob'
                  total:
                    type: integer
    post:
      tags: [Backtest]
      summary: Run a backtest or create a backtest job
      description: |
        Accepts two request formats:

        1. **Sync (legacy)**: `strategy` + `stock_pool` + `start_date` + `end_date` —
           runs the backtest synchronously and returns the result.
        2. **Async (job)**: `strategy_id` + `universe` + `start_date` + `end_date` —
           creates an async job and returns the job ID immediately.
      operationId: runBacktest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/BacktestRequest'
                - $ref: '#/components/schemas/CreateJobRequest'
      responses:
        '200':
          description: Synchronous backtest result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacktestResponse'
        '202':
          description: Async job created
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                  status:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/ConflictPrecondition'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/backtest/{id}:
    get:
      tags: [Backtest]
      summary: Get a backtest job by ID
      operationId: getBacktest
      parameters:
        - $ref: '#/components/parameters/BacktestId'
      responses:
        '200':
          description: Backtest job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacktestJob'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/backtest/{id}/report:
    get:
      tags: [Backtest]
      summary: Get backtest report
      description: Returns the full backtest report including metrics, trades, and equity curve.
      operationId: getBacktestReport
      parameters:
        - $ref: '#/components/parameters/BacktestId'
      responses:
        '200':
          description: Backtest report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacktestResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/backtest/{id}/trades:
    get:
      tags: [Backtest]
      summary: Get backtest trades
      operationId: getBacktestTrades
      parameters:
        - $ref: '#/components/parameters/BacktestId'
      responses:
        '200':
          description: List of trades
          content:
            application/json:
              schema:
                type: object
                properties:
                  backtest_id:
                    type: string
                  total:
                    type: integer
                  trades:
                    type: array
                    items:
                      $ref: '#/components/schemas/Trade'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/backtest/{id}/equity:
    get:
      tags: [Backtest]
      summary: Get backtest equity curve
      operationId: getBacktestEquity
      parameters:
        - $ref: '#/components/parameters/BacktestId'
      responses:
        '200':
          description: Equity curve data
          content:
            application/json:
              schema:
                type: object
                properties:
                  backtest_id:
                    type: string
                  total_points:
                    type: integer
                  equity_curve:
                    type: array
                    items:
                      $ref: '#/components/schemas/PortfolioValue'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/backtest/{id}/export/{format}:
    get:
      tags: [Backtest]
      summary: Export backtest report
      description: Exports the backtest report in the specified format (currently only `html`).
      operationId: exportBacktest
      parameters:
        - $ref: '#/components/parameters/BacktestId'
        - name: format
          in: path
          required: true
          schema:
            type: string
            enum: [html]
        - name: theme
          in: query
          schema:
            type: string
            enum: [light, dark]
            default: light
        - name: equity
          in: query
          schema:
            type: string
            default: "1"
        - name: trades
          in: query
          schema:
            type: string
            default: "1"
      responses:
        '200':
          description: HTML report file
          content:
            text/html:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/backtest/compare:
    get:
      tags: [Backtest]
      summary: Compare multiple backtest results
      description: Compares 2-8 backtest results side by side.
      operationId: compareBacktests
      parameters:
        - name: ids
          in: query
          required: true
          description: Comma-separated list of 2-8 backtest IDs.
          schema:
            type: string
          example: bt-001,bt-002,bt-003
      responses:
        '200':
          description: Comparison report
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'

  # ============================================================
  # WalkForward
  # ============================================================
  /api/walkforward:
    post:
      tags: [WalkForward]
      summary: Run walk-forward validation
      operationId: runWalkForward
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalkForwardRequest'
      responses:
        '200':
          description: Walk-forward report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalkForwardReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [WalkForward]
      summary: List walk-forward reports
      operationId: listWalkForwardReports
      responses:
        '200':
          description: List of walk-forward reports
          content:
            application/json:
              schema:
                type: object
                properties:
                  reports:
                    type: array
                    items:
                      $ref: '#/components/schemas/WalkForwardReport'
                  count:
                    type: integer

  /api/walkforward/{strategy_id}:
    get:
      tags: [WalkForward]
      summary: Get latest walk-forward report for a strategy
      operationId: getWalkForwardReport
      parameters:
        - name: strategy_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Walk-forward report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalkForwardReport'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # Batch
  # ============================================================
  /api/batch:
    post:
      tags: [Batch]
      summary: Run batch backtests
      description: Runs multiple backtest tasks concurrently with optional walk-forward validation.
      operationId: runBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRunRequest'
      responses:
        '200':
          description: Batch report
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/batch/{batch_id}:
    get:
      tags: [Batch]
      summary: Get batch report
      operationId: getBatchReport
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Batch report
          content:
            application/json:
              schema:
                type: object
        '404':
          $ref: '#/components/responses/NotFound'

  /api/batch/{batch_id}/export/{format}:
    get:
      tags: [Batch]
      summary: Export batch report
      operationId: exportBatchReport
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: path
          required: true
          schema:
            type: string
            enum: [json, csv]
      responses:
        '200':
          description: Exported file
          content:
            application/json:
              schema:
                type: object
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # Strategies
  # ============================================================
  /api/strategies:
    get:
      tags: [Strategies]
      summary: List strategies
      description: Returns all strategies, optionally filtered by type or active status.
      operationId: listStrategies
      parameters:
        - name: type
          in: query
          schema:
            type: string
        - name: active
          in: query
          schema:
            type: string
            enum: ["true", "false"]
      responses:
        '200':
          description: List of strategies
          content:
            application/json:
              schema:
                type: object
                properties:
                  strategies:
                    type: array
                    items:
                      $ref: '#/components/schemas/StrategyConfig'
    post:
      tags: [Strategies]
      summary: Create a strategy
      operationId: createStrategy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStrategyRequest'
      responses:
        '200':
          description: Strategy created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  strategy_id:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/strategies/{id}:
    get:
      tags: [Strategies]
      summary: Get a strategy by ID
      operationId: getStrategy
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Strategy configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategyConfig'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Strategies]
      summary: Update a strategy
      operationId: updateStrategy
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStrategyRequest'
      responses:
        '200':
          description: Strategy updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  strategy_id:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Strategies]
      summary: Delete a strategy
      operationId: deleteStrategy
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Strategy deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  strategy_id:
                    type: string

  # ============================================================
  # Datasource
  # ============================================================
  /api/datasource/status:
    get:
      tags: [Datasource]
      summary: Get data source status
      operationId: getDatasourceStatus
      responses:
        '200':
          description: Data source status
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                  primary:
                    type: string
                  stopped:
                    type: array
                    items:
                      type: string

  /api/datasource/health:
    get:
      tags: [Datasource]
      summary: Check data source connectivity
      operationId: checkDatasourceHealth
      responses:
        '200':
          description: Data source is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  primary:
                    type: string
        '503':
          description: Data source unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ============================================================
  # Plugins
  # ============================================================
  /api/plugins:
    get:
      tags: [Plugins]
      summary: List all plugins
      operationId: listPlugins
      responses:
        '200':
          description: List of plugins
          content:
            application/json:
              schema:
                type: object
                properties:
                  plugins:
                    type: array
                    items:
                      type: object
                  count:
                    type: integer

  /api/plugins/active:
    get:
      tags: [Plugins]
      summary: List active plugins
      operationId: listActivePlugins
      responses:
        '200':
          description: List of active plugins
          content:
            application/json:
              schema:
                type: object
                properties:
                  plugins:
                    type: array
                    items:
                      type: object
                  count:
                    type: integer

  /api/plugins/{name}:
    get:
      tags: [Plugins]
      summary: Get plugin info
      operationId: getPlugin
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Plugin info
          content:
            application/json:
              schema:
                type: object
        '404':
          $ref: '#/components/responses/NotFound'

  /api/plugins/load:
    post:
      tags: [Plugins]
      summary: Load a plugin from file
      operationId: loadPlugin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
      responses:
        '200':
          description: Plugin loaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  plugin:
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/plugins/{name}/unload:
    post:
      tags: [Plugins]
      summary: Unload a plugin
      operationId: unloadPlugin
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Plugin unloaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  name:
                    type: string
        '500':
          $ref: '#/components/responses/InternalError'

  /api/plugins/{name}/reload:
    post:
      tags: [Plugins]
      summary: Reload a plugin by name
      operationId: reloadPluginByName
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Plugin reloaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  plugin:
                    type: object
        '500':
          $ref: '#/components/responses/InternalError'

  /api/plugins/reload:
    post:
      tags: [Plugins]
      summary: Reload a plugin from file path
      operationId: reloadPluginByPath
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
      responses:
        '200':
          description: Plugin reloaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  plugin:
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/plugins/load-all:
    post:
      tags: [Plugins]
      summary: Load all plugins from watch directory
      operationId: loadAllPlugins
      responses:
        '200':
          description: Load-all completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  loaded:
                    type: array
                    items:
                      type: string
                  errors:
                    type: array
                    items:
                      type: string
                  count:
                    type: integer
                  errCount:
                    type: integer

  /api/plugins/watch-dir:
    get:
      tags: [Plugins]
      summary: Get watch directory
      operationId: getWatchDir
      responses:
        '200':
          description: Watch directory
          content:
            application/json:
              schema:
                type: object
                properties:
                  watch_dir:
                    type: string
    post:
      tags: [Plugins]
      summary: Set watch directory
      operationId: setWatchDir
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dir]
              properties:
                dir:
                  type: string
      responses:
        '200':
          description: Watch directory set
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  dir:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'

  # ============================================================
  # Factor
  # ============================================================
  /api/factor/list:
    get:
      tags: [Factor]
      summary: List available factors
      operationId: listFactors
      responses:
        '200':
          description: List of factors
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  factors:
                    type: array
                    items:
                      type: string

  /api/factor/returns/{factor}:
    get:
      tags: [Factor]
      summary: Get factor returns time series
      operationId: getFactorReturns
      parameters:
        - name: factor
          in: path
          required: true
          schema:
            type: string
            enum: [momentum, value, quality, volatility, size, growth]
        - name: start_date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Factor returns time series
          content:
            application/json:
              schema:
                type: object
                properties:
                  factor:
                    type: string
                  start_date:
                    type: string
                  end_date:
                    type: string
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      type: object
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/factor/ic/{factor}:
    get:
      tags: [Factor]
      summary: Get factor IC time series
      operationId: getFactorIC
      parameters:
        - name: factor
          in: path
          required: true
          schema:
            type: string
            enum: [momentum, value, quality, volatility, size, growth]
        - name: start_date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: IC time series
          content:
            application/json:
              schema:
                type: object
                properties:
                  factor:
                    type: string
                  start_date:
                    type: string
                  end_date:
                    type: string
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      type: object
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/factor/compute-returns:
    post:
      tags: [Factor]
      summary: Compute factor returns for a date
      operationId: computeFactorReturns
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [factor, trade_date]
              properties:
                factor:
                  type: string
                trade_date:
                  type: string
                  format: date
      responses:
        '200':
          description: Factor returns computed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  factor:
                    type: string
                  trade_date:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/factor/compute-ic:
    post:
      tags: [Factor]
      summary: Compute factor IC for a date
      operationId: computeFactorIC
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [factor, trade_date]
              properties:
                factor:
                  type: string
                trade_date:
                  type: string
                  format: date
                forward_days:
                  type: integer
                  default: 20
      responses:
        '200':
          description: IC computed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  factor:
                    type: string
                  trade_date:
                    type: string
                  forward_days:
                    type: integer
                  ic:
                    type: number
                  p_value:
                    type: number
                  top_ic:
                    type: number
        '400':
          $ref: '#/components/responses/BadRequest'

  # ============================================================
  # Copilot (AI strategy generation)
