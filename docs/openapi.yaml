          $ref: '#/components/responses/BadRequest'
        '502':
          description: Data service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/screen:
    post:
      tags: [Data Proxy]
      summary: Screen stocks (proxied)
      operationId: screenStocks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Screen results
          content:
            application/json:
              schema:
                type: object
        '502':
          description: Data service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/stocks/count:
    get:
      tags: [Data Proxy]
      summary: Stock records + status split (proxied)
      description: >
        网关是字段透传（proxyRequest 解码成 map 再编码），形状由数据服务定义，
        见 docs/SPEC.md §1「GET /stocks/count 的响应形状」。
      operationId: getStockCount
      responses:
        '200':
          description: >
            count 含已退市记录，且等于 by_status 各档之和 —— 它不是"在市股票数"；
            要在市数取 by_status.active。
          content:
            application/json:
              schema:
                type: object
                required: [count, by_status, latest_date]
                properties:
                  count:
                    type: integer
                    format: int64
                    description: 全表行数（含已退市），由 by_status 各档求和导出，非第二次 COUNT(*)
                  by_status:
                    type: object
                    description: >
                      逐值等于 SELECT status, COUNT(*) FROM stocks GROUP BY status。
                      status 为 NULL 或空串的行折成 "unknown" 一档（该列可空）；
                      票池为空时序列化为 {}，不是 null。
                    additionalProperties:
                      type: integer
                      format: int64
                  latest_date:
                    type: string
                    format: date
                    nullable: true
                    description: >
                      行情最新日 = SELECT MAX(trade_date) FROM ohlcv_daily_qfq（DATA-03）。
                      键**恒在**：有行情时是 YYYY-MM-DD，库里还没有行情时是显式 null。
                      读失败不再折成 null —— handler 让这一趟失败回 5xx，
                      所以 null 只表示「没有读数」这一个意思，不背「读挂了」这层含义。
                      形状问题由 DATA-03 关闭（原形状把 date 扫进 **string 且丢弃
                      error，该字段在任何库里都不曾出现）。
        '500':
          description: >
            这一趟没读成（票池拆分或行情日期任一失败）。DATA-03 之后读失败不再折成
            「200 + 字段缺席/为 null」；文案点名失败的那一步，底层原因只进服务端日志。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/market/index:
    get:
      tags: [Data Proxy]
      summary: Get market index (proxied)
      description: >
        数据服务从 ohlcv_daily_qfq 取三个指数代码的最新一期与上一期收盘（一趟窗口函数）。
        库里这三个代码当前 0 行（没有指数日线表），所以实测回 `{"indices":[]}` ——
        这是诚实读数，不是缺陷；补指数 bar 需要新数据源与建表，已登记为 DATA-12（待主任批准）。
        读失败回 500（见本路径的 '500'），不是把失败折成空数组。
      operationId: getMarketIndex
      responses:
        '200':
          description: >
            indices 恒为数组（没数据是 []，不是 null，也不是编一条零值条目）。
            volume 单位股、amount 单位 CNY（规范层口径，DATA-04/05），服务端不做换算，
            亿/万的展示由前端负责。pct 是**百分数刻度**（1.23 == +1.23%）。
            change/pct 在没有上一期收盘时为 null（「无从算起」不显示成 +0.00%）；
            amount 在 turnover 为 NULL 时同理。
          content:
            application/json:
              schema:
                type: object
                required: [indices]
                properties:
                  indices:
                    type: array
                    items:
                      type: object
                      required: [code, name, close, volume]
                      properties:
                        code:
                          type: string
                          description: 指数代码，如 000300.SH
                        name:
                          type: string
                          description: 中文名由服务端给（沪深300 等），前端不再各自维护映射
                        close:
                          type: number
                          format: double
                        change:
                          type: number
                          format: double
                          nullable: true
                          description: 与上一期收盘的差；没有上一期时为 null
                        pct:
                          type: number
                          format: double
                          nullable: true
                          description: 涨跌幅，百分数刻度（1.23 == +1.23%）
                        volume:
                          type: number
                          format: double
                          description: 成交量，单位**股**（原样透出，不换算成手/万/亿）
                        amount:
                          type: number
                          format: double
                          nullable: true
                          description: 成交额，单位**CNY**；turnover 列为 NULL 时是 null，不是 0
        '500':
          description: >
            指数 bar 这一趟没读成（DATA-07）。旧形状把读失败折成「200 + 这条不出现」，
            与「这个指数没有日线」长得一样；现在失败回 500，没数据才回 []。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/sync/calendar:
    post:
      tags: [Data Proxy]
      summary: Sync trading calendar (proxied)
      operationId: syncCalendar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Calendar sync result
          content:
            application/json:
              schema:
                type: object

  /api/v1/trading/calendar:
    get:
      tags: [Data Proxy]
      summary: Get trading calendar (proxied)
      operationId: getTradingCalendar
      parameters:
        - name: start
          in: query
          schema:
            type: string
        - name: end
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Trading calendar
          content:
            application/json:
              schema:
                type: object

  /api/ingest/raw:
    post:
      tags: [Evidence]
      summary: Archive a raw external-source response into ingest.raw
      description: |
        L0 ingest write door (ADR-022 §2/§3 / TASKS.md L0-1). The platform's
        single write door into `ingest.raw` (class A). The data service writes
        here in-process at the tushare request choke point; external producers
        — in practice the akshare side of work face 1 — post here so their data
        becomes citable via GET /api/evidence/{content_hash} instead of being
        copied into a second store.

        The door is deliberately narrow: it archives a verbatim payload and
        returns the content_hash that citations must carry. It does not
        normalise, interpret, or validate domain content — normalisation is a
        separate, reproducible step that reads these rows back.

        Idempotent: content_hash is the primary key and the insert is
        ON CONFLICT DO NOTHING, so re-posting the same response is a no-op and
        never rewrites the original attribution.
      operationId: ingestRaw
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RawIngestWrite'
      responses:
        '201':
          description: Archived, or already present. Returns the stored record carrying the authoritative content_hash.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RawIngest'
        '400':
          description: |
            Rejected before any write: missing source/dataset/key/payload,
            malformed body, a content_hash that does not match the payload, or
            an as_of that is neither `YYYY-MM-DD` nor RFC3339.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The archive write failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/ingest/equitydeep:
    post:
      tags: [Evidence]
      summary: Normalize archived EquityDeep snapshots into fundamentals_detail
      description: |
        Class-B ingest door (ADR-022 §2 / TASKS.md EQD-P1-2, C-3). Consumes an
        ndjson stream — one `contracts/snapshot.schema.json` record per line —
        and writes `fundamentals_detail` rows.

        Provenance gate: the caller must first archive the exact snapshot file
        through `POST /api/ingest/raw` and pass the content_hash it received. A
        hash ingest.raw does not know is rejected, and every written row is
        stamped with that hash as its `snapshot_uri` — no number enters
        fundamentals_detail without a resolvable raw response behind it.

        Normalization rules (pure package `pkg/data/equitydeep`, contract C1-a):
        raw_names is an explicit whitelist; unit conversion uses `unit_scale` and
        an absent unit falls back to the dictionary base_unit; a string value
        carrying a self-described magnitude suffix (亿/亿元 → CNY_100m, 万/万元 →
        CNY_10k) is converted by that suffix, with thousands separators stripped.
        Fields outside the whitelist, and values that are not parseable numbers,
        are dropped and reported in `dropped` rather than guessed.
      operationId: ingestEquityDeep
      parameters:
        - name: content_hash
          in: query
          required: true
          description: 64-char lowercase hex hash returned by POST /api/ingest/raw for the archived snapshot file
          schema:
            type: string
            pattern: '^[0-9a-f]{64}$'
      requestBody:
        required: true
        description: ndjson — one snapshot record per line
        content:
          application/x-ndjson:
            schema:
              type: string
      responses:
        '201':
          description: Snapshots normalized and written
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquityDeepIngestResponse'
        '400':
          description: |
            Rejected before any write: a malformed content_hash, a hash that was
            never ingested, a line that is not a contract snapshot, a contract
            violation (bad ticker, missing report_period / ann_date, unknown
            unit, unknown snapshot key), an empty body, or a body over 32 MiB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The fundamentals_detail write failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The field dictionary was not loadable at startup, so there is no whitelist or conversion table to normalize with
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/evidence/{content_hash}:
    get:
      tags: [Evidence]
      summary: Resolve a citation's content_hash to its archived source response
      description: |
        L0 evidence service (ADR-022 §5 / TASKS.md L0-3). Returns the single
        archived record in `ingest.raw` for the given hash. `404` means the
        hash was never ingested — that is a first-class answer, not an error.
        Work faces read data through this endpoint instead of keeping copies.
      operationId: getEvidence
      parameters:
        - name: content_hash
          in: path
          required: true
          description: SHA-256 hex digest of the canonicalized source payload (64 lowercase chars)
          schema:
            type: string
            pattern: '^[0-9a-f]{64}$'
      responses:
        '200':
          description: The archived source response for that content_hash
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RawIngest'
        '404':
          description: Evidence not ingested — no `ingest.raw` row for this hash
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: evidence not ingested
                  content_hash:
                    type: string
        '500':
          description: Evidence lookup failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/signals:
    post:
      tags: [Signals]
      summary: Batch-write external model signals (K8 write door)
      description: |
        K8 (TASKS.md K8 ③.4): the HTTP write door through which out-of-process
        ML models inject signals into the kernel. Consumption side is
        `strategy.SignalStrategy`, which pulls by `as_of` (future signals are
        physically invisible) and drives orders.

        Fail-loud validation, all-or-nothing per request:
        every item must pass `ValidateExternalSignal` (model_id / symbol /
        direction ∈ {long, short, close} / finite strength / non-zero as_of),
        and `as_of` must not be in the future (UTC-day granularity). Any bad
        item rejects the whole batch with 400 and an indexed error message.

        Idempotency: `content_hash` dedupe lives in the store
        (`ON CONFLICT (content_hash) DO NOTHING`) — retrying the same batch is
        safe and does not duplicate rows.

        K8: requires role `trader` or `admin` (RBAC, same gate as order
        mutation). A `viewer` token gets 403.
      operationId: createSignals
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signals]
              properties:
                signals:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/ExternalSignal'
            example:
              signals:
                - model_id: ml-model
                  symbol: 600000.SH
                  direction: long
                  strength: 0.8
                  as_of: '2026-10-12T00:00:00Z'
                  factors:
                    momentum_z: 1.7
      responses:
        '201':
          description: Batch accepted (idempotent retries may not add new rows)
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: integer
                    example: 1
        '400':
          description: Invalid body, empty batch, bad signal (indexed), or future as_of (indexed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid access token
        '403':
          description: Authenticated but role is not trader/admin
        '503':
          description: Signal store unavailable (not wired / no database)

  # ============================================================
  # Industry (P2-2 产业链静态数据层)
  # ============================================================
  /api/industry/tree:
    get:
      tags: [Industry]
      summary: List the SW (申万) industry tree
      description: |
        Read-only door over `quant.sw_industry_tree` (P2-2). Every row carries
        `source` + `as_of` provenance columns — this layer replaces hand-kept
        snapshots. `is_leaf` is derived from parent-child relations at import
        time (no upstream API field).

        Filters are optional and composable: `level` restricts the hierarchy
        tier (1/2/3), `parent_code` selects children of one node (empty string
        = first-tier industries). Empty results return `200` with an empty
        array — "no rows" is an answer, not an error.
      operationId: listIndustryTree
      parameters:
        - name: level
          in: query
          required: false
          description: Hierarchy tier (1/2/3). Must be an integer >= 1.
          schema:
            type: integer
            minimum: 1
            example: 1
        - name: parent_code
          in: query
          required: false
          description: Parent industry code; empty string selects first-tier industries.
          schema:
            type: string
            example: 801010
      responses:
        '200':
          description: Matching industry tree nodes, ordered by code
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    example: 3
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SWIndustryNode'
        '400':
          description: Invalid `level` (not an integer >= 1)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Industry data layer unavailable (store not wired / no database)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/industry/edges:
    get:
      tags: [Industry]
      summary: List supply-chain / industry-membership edges
      description: |
        Read-only door over `quant.supply_chain_edge` (P2-2). An edge maps two
        endpoints — each either a symbol (`600519.SH`) or an industry code
        (`801080.SI`) — with `relation` giving the semantics
        (`industry_member` = SW industry membership from tushare `index_member`;
        component→product relations use their own values).

        At least one filter is required: the edge table is a graph whose size
        grows with the mapping, so unfiltered full scans are rejected with 400
        (the store enforces the same rule for non-HTTP callers).
      operationId: listSupplyChainEdges
      parameters:
        - name: upstream
          in: query
          required: false
          description: Upstream endpoint (symbol or industry code)
          schema:
            type: string
            example: 600519.SH
        - name: downstream
          in: query
          required: false
          description: Downstream endpoint (symbol or industry code)
          schema:
            type: string
            example: 801080.SI
        - name: relation
          in: query
          required: false
          description: Relation type
          schema:
            type: string
            example: industry_member
      responses:
        '200':
          description: Matching edges, ordered by (upstream, downstream)
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    example: 2
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SupplyChainEdge'
        '400':
          description: No filter supplied (unfiltered scans are rejected)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Industry data layer unavailable (store not wired / no database)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/industry/vitality:
    get:
      tags: [Industry]
      summary: List industry vitality (景气) indicator observations
      description: |
        Read-only door over `quant.industry_vitality` (P2-2). Point-in-time
        observations: `obs_date` is part of the unique key together with
        `source`, so different sources keep separate rows and corrections do
        not overwrite history. First version is seeded by CSV (no tushare API);
        `source` identifies the maintainer.

        `industry_code` is required. `start_date` / `end_date` are inclusive
        `YYYY-MM-DD` bounds; `start_date` after `end_date` is a 400.
      operationId: listIndustryVitality
      parameters:
        - name: industry_code
          in: query
          required: true
          description: Industry code (e.g. SW industry code)
          schema:
            type: string
            example: 801080.SI
        - name: metric
          in: query
          required: false
          description: Metric name (e.g. gross_margin, revenue_yoy)
          schema:
            type: string
            example: gross_margin
        - name: start_date
          in: query
          required: false
          description: Inclusive lower bound (YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: '2200-01-01'
        - name: end_date
          in: query
          required: false
          description: Inclusive upper bound (YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: '2200-01-31'
      responses:
        '200':
          description: Matching observations, ordered by (obs_date, metric)
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    example: 3
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/IndustryVitality'
        '400':
          description: Missing `industry_code`, malformed date, or `start_date` after `end_date`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Industry data layer unavailable (store not wired / no database)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/industry/etf/{etf_code}/constituents:
    get:
      tags: [Industry]
      summary: List ETF constituents (holdings)
      description: |
        Read-only door over `quant.etf_constituent` (P2-2), populated from
        tushare `fund_portfolio`. Point-in-time: `obs_date` (report period) is
        part of the unique key, so a rebalanced ETF keeps its old report
        periods. Without `obs_date` the latest report period is returned
        (weight DESC); pass an explicit `obs_date` to read a historical
        snapshot.
      operationId: listETFConstituents
      parameters:
        - name: etf_code
          in: path
          required: true
          description: ETF fund code
          schema:
            type: string
            example: 510300.SH
        - name: obs_date
          in: query
          required: false
          description: Report period (YYYY-MM-DD). Omit for the latest period.
          schema:
            type: string
            format: date
            example: '2200-01-01'
      responses:
        '200':
          description: Matching constituent holdings, ordered by weight DESC
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    example: 2
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ETFConstituent'
        '400':
          description: Malformed `obs_date`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Industry data layer unavailable (store not wired / no database)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ============================================================
  # Macro (P2-1 国内宏观指标层)
  # ============================================================
  /api/macro/series:
    get:
      tags: [Macro]
      summary: List domestic macro indicator observations
      description: |
        Read-only door over `quant.macro_series` (P2-1). Domestic macro
        indicators imported from Tushare (reusing `TUSHARE_TOKEN`, 0 new
        keys): `cn_cpi` → CPI_YOY, `cn_ppi` → PPI_YOY, `cn_pmi` → PMI,
        `cn_m` → M2 / M2_YOY, `sf_month` → TSF_INC, `shibor_lpr` → LPR_1Y /
        LPR_5Y, `fx_daily` → USDCNY_CLOSE. This layer is national-level;
        the industry-level vitality series (P2-2) lives under
        `/api/industry/vitality`.

        Every row carries `source` + `as_of` provenance columns. The unique
        key (indicator, freq, obs_date, source) makes re-imports idempotent
        and keeps different sources side by side. `obs_date` is the
        **observation date** (monthly indicators use the first day of the
        month); `fx_daily`'s `trade_date` is stored as returned (GMT, per
        Tushare docs — no timezone shift). The **visibility (point-in-time)
        anchor is `as_of` (import time), not `obs_date`**: macro values are
        released *after* their observation date (September CPI lands mid
        October), so backtest filtering must bound by `as_of`, never by
        `obs_date`.

        `indicator` is required. `freq` (M/D), the inclusive `start_date` /
        `end_date` bounds, and `limit` (row cap: default 1000, max 5000) are
        optional. Results are ordered by `obs_date` **descending** (newest
        first) and capped at `limit` — truncation drops the oldest rows,
        never the newest. When the returned row count reaches `limit` the
        response carries `truncated: true` plus a `hint` describing how to
        drill into older windows via `start_date` / `end_date`. Empty results
        return `200` with an empty array — "no rows" is an answer, not an
        error.
      operationId: listMacroSeries
      parameters:
        - name: indicator
          in: query
          required: true
          description: |
            Indicator code. Catalog (see `pkg/data/macro.go`
            `macroIndicatorSpecs`): `CPI_YOY`, `PPI_YOY`, `PMI`, `M2`,
            `M2_YOY`, `TSF_INC`, `LPR_1Y`, `LPR_5Y`, `USDCNY_CLOSE`.
          schema:
            type: string
            example: CPI_YOY
        - name: freq
          in: query
          required: false
          description: Frequency filter (M = monthly, D = daily). Omit to accept both.
          schema:
            type: string
            enum: [M, D]
            example: M
        - name: start_date
          in: query
          required: false
          description: Inclusive lower bound (YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: '2020-01-01'
        - name: end_date
          in: query
          required: false
          description: Inclusive upper bound (YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: '2026-08-31'
        - name: limit
          in: query
          required: false
          description: |
            Maximum rows to return (1..5000, default 1000). Values outside
            1..5000 — including 0 — are rejected with `400`. Truncation
            keeps the newest rows; narrow `start_date` / `end_date` to
            reach older ones.
          schema:
            type: integer
            minimum: 1
            maximum: 5000
            default: 1000
            example: 1000
      responses:
        '200':
          description: |
            Matching observations, newest first (`obs_date` descending),
            capped at `limit`. `truncated: true` means the cap was hit and
            older rows may exist.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    description: Number of rows returned (capped at limit)
                    example: 80
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MacroSeries'
                  limit:
                    type: integer
                    description: Effective row cap applied to this response
                    example: 1000
                  truncated:
                    type: boolean
                    description: |
                      Present and `true` when `total == limit` — older rows
                      may exist. Use `start_date` / `end_date` to drill into
                      older windows.
                    example: true
                  hint:
                    type: string
                    description: Human-readable next step shown when `truncated` is true.
                    example: 结果达到 limit=1000，可能被截断；用 start_date/end_date 缩小范围获取更旧的数据
        '400':
          description: Missing `indicator`, malformed date, `start_date` after `end_date`, or `limit` outside 1..5000
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Macro data layer unavailable (store not wired / no database)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  # ============================================================
  # Security
  # ============================================================
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer token obtained via POST /api/auth/login.

  # ============================================================
  # Parameters
  # ============================================================
  parameters:
    BacktestId:
      name: id
      in: path
      required: true
      description: Backtest job ID.
      schema:
        type: string

  # ============================================================
  # Responses
  # ============================================================
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required or failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ConflictPrecondition:
      description: |
        The request is well-formed, but a **data precondition** is not met right now
        (e.g. the trading calendar has not been synced for the requested range).

        Distinct from `400`: nothing about the request itself is wrong, so the caller
        should not "fix the request" — it should make the data available first
        (`POST /api/sync/jobs` with `type: "calendar"`).

        This used to be reported as `500 internal` (AUD-60) because every engine error
        was flattened to 500, which told the client "server broke" and logged a
        self-solvable precondition as a server-side error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  # ============================================================
  # Schemas
  # ============================================================
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Human-readable message. Stable enough to display, not to parse.
        code:
          type: string
          description: |
            Machine-readable category, so clients branch on this instead of matching the
            prose. Emitted by the single error sink (`internal/httpserver`), derived from
            the HTTP status: `bad_request` / `unauthorized` / `forbidden` / `not_found` /
            `conflict` / `rate_limited` / `unavailable` / `internal`.
        details:
          type: string
          description: Legacy field; not emitted by the current error sink.
        status:
          type: string
          description: Legacy field; not emitted by the current error sink.

    RawIngestWrite:
      type: object
      description: |
        Wire format of POST /api/ingest/raw. The payload is archived verbatim;
        content_hash is computed by the server from the payload, never trusted
        from the caller.
      required: [source, dataset, key, payload]
      properties:
        source:
          type: string
          description: Data source that produced the response
          example: akshare
        dataset:
          type: string
          description: Logical dataset name within the source
          example: akshare.stock_financial_abstract
        key:
          type: string
          description: Source-native key of the record
          example: 600519.SH/2024Q1
        payload:
          type: object
          description: The raw source response, archived verbatim
        as_of:
          type: string
          nullable: true
          description: |
            Observation date the payload describes (`YYYY-MM-DD` or RFC3339) —
            not the fetch time. Omit when the payload has no single date.
          example: '2024-09-30'
        content_hash:
          type: string
          description: |
            Optional. When supplied it is verified against the payload, letting
            a caller confirm it is re-sending the response it cited; a mismatch
            is rejected instead of poisoning the evidence index.

    ExternalSignal:
      type: object
      description: |
        One external model signal injected into the kernel (K7/K8 contract,
        `strategy.ExternalSignal`). The kernel only accepts the signal contract —
        model freedom stays out of process. `content_hash` covers the executable
        fields (model_id, symbol, direction, strength, as_of); `factors` is a
        diagnostic snapshot that is stored but not hashed.
      required: [model_id, symbol, direction, strength, as_of]
      properties:
        model_id:
          type: string
          description: Out-of-process model identifier (citation `source` position)
          example: ml-model
        symbol:
          type: string
          description: Instrument symbol (citation `key` position)
          example: 600000.SH
        direction:
          type: string
          enum: [long, short, close]
          description: Signal direction. `hold` is not a signal — send nothing instead.
        strength:
          type: number
          format: double
          description: Signal strength. No range constraint (scale is model-defined); NaN/±Inf rejected.
          example: 0.8
        as_of:
          type: string
          format: date-time
          description: |
            Trading day / moment the signal applies to (RFC3339). Compared at
            UTC-day granularity; future values are rejected at the write door.
          example: '2026-10-12T00:00:00Z'
        factors:
          type: object
          additionalProperties:
            type: number
            format: double
          description: Optional diagnostic factor snapshot (excluded from content_hash)
          example:
            momentum_z: 1.7

    SWIndustryNode:
      type: object
      description: |
        One node of the SW (申万) industry tree (`quant.sw_industry_tree`, P2-2).
        `source` + `as_of` are the provenance columns that replace hand-kept
        snapshots; `code` is the unique (idempotency) key.
      required: [code, level, name, source, as_of]
      properties:
        code:
          type: string
          description: SW industry code (unique key)
          example: 801080.SI
        parent_code:
          type: string
          description: Parent industry code; empty string for first-tier industries
          example: 801010
        level:
          type: integer
          description: Hierarchy tier (1/2/3)
          example: 2
        name:
          type: string
          description: Industry name
          example: 食品饮料
        is_leaf:
          type: boolean
          description: True when no node has this code as parent (derived at import)
          example: false
        source:
          type: string
          description: Provenance — source identifier (e.g. tushare)
          example: tushare
        as_of:
          type: string
          format: date-time
          description: Provenance — observation moment of this row (RFC3339)
          example: '2026-10-12T00:00:00Z'

    SupplyChainEdge:
      type: object
      description: |
        One upstream/downstream or industry-membership mapping
        (`quant.supply_chain_edge`, P2-2). Endpoints are either a symbol or an
        industry code; `relation` carries the semantics. Unique key
        (upstream, downstream, relation) — re-importing refreshes the row.
      required: [upstream, downstream, relation, source, as_of]
      properties:
        upstream:
          type: string
          description: Upstream endpoint (symbol or industry code)
          example: 600519.SH
        downstream:
          type: string
          description: Downstream endpoint (symbol or industry code)
          example: 801080.SI
        relation:
          type: string
          description: Relation type (industry_member = SW industry membership)
          example: industry_member
        weight:
          type: number
          format: double
          description: Relation-defined weight (membership edges carry 0 — index_member has no weight)
          example: 0
        source:
          type: string
          description: Provenance — source identifier
          example: tushare
        as_of:
          type: string
          format: date-time
          description: Provenance — observation moment of this row (RFC3339)
          example: '2026-10-12T00:00:00Z'

    IndustryVitality:
      type: object
      description: |
        One industry vitality (景气) indicator observation
        (`quant.industry_vitality`, P2-2). Point-in-time: the unique key
        (industry_code, metric, obs_date, source) includes `source`, so
        different sources keep separate rows.
      required: [industry_code, metric, obs_date, value, source, as_of]
      properties:
        industry_code:
          type: string
          description: Industry code
          example: 801080.SI
        metric:
          type: string
          description: Metric name
          example: gross_margin
        obs_date:
          type: string
          format: date
          description: Observation date of the metric (PIT key component)
          example: '2200-01-01'
        value:
          type: number
          format: double
          description: Metric value
          example: 13.42
        unit:
          type: string
          description: Unit of measurement (may be empty)
          example: '%'
        source:
          type: string
          description: Provenance — source / maintainer identifier
          example: seed-csv
        as_of:
          type: string
          format: date-time
          description: Provenance — observation moment of this row (RFC3339)
          example: '2026-10-12T00:00:00Z'

    ETFConstituent:
      type: object
      description: |
        One ETF constituent holding (`quant.etf_constituent`, P2-2), from
        tushare `fund_portfolio`. Point-in-time: the unique key
        (etf_code, symbol, obs_date) includes the report period, so a
        rebalanced ETF keeps its old periods.
      required: [etf_code, symbol, obs_date, source, as_of]
      properties:
        etf_code:
          type: string
          description: ETF fund code
          example: 510300.SH
        symbol:
          type: string
          description: Constituent symbol
          example: 600519.SH
        weight:
          type: number
          format: double
          description: Share of net value in percent (tushare stk_mkv_ratio scale)
          example: 5.23
        obs_date:
          type: string
          format: date
          description: Report period (PIT key component)
          example: '2200-01-01'
        source:
          type: string
          description: Provenance — source identifier
          example: tushare
        as_of:
          type: string
          format: date-time
          description: Provenance — observation moment of this row (RFC3339)
          example: '2026-10-12T00:00:00Z'

    MacroSeries:
      type: object
      description: |
        One domestic macro indicator observation (`quant.macro_series`, P2-1).
        Imported from Tushare (0 new keys). The unique key
        (indicator, freq, obs_date, source) includes `source`, so different
        sources keep separate rows and re-imports refresh in place.
        National-level — see `IndustryVitality` for the industry-level series.
      required: [indicator, freq, obs_date, value, source, as_of]
      properties:
        indicator:
          type: string
          description: |
            Indicator code (catalog: pkg/data/macro.go macroIndicatorSpecs):
            CPI_YOY, PPI_YOY, PMI, M2, M2_YOY, TSF_INC, LPR_1Y, LPR_5Y,
            USDCNY_CLOSE.
          example: CPI_YOY
        freq:
          type: string
          description: Frequency (M = monthly, D = daily)
          enum: [M, D]
          example: M
        obs_date:
          type: string
          format: date
          description: |
            Observation date (PIT key component). Monthly indicators use the
            first day of the month; `fx_daily` rows carry the Tushare
            `trade_date` as returned (GMT — no timezone shift).
          example: '2026-08-01'
        value:
          type: number
          format: double
          description: Observation value (unit column carries the scale)
          example: 0.8
        unit:
          type: string
          description: Unit of measurement (%, 亿元, 点, 汇率; may be empty)
          example: '%'
        source:
          type: string
          description: Provenance — source identifier
          example: tushare
        as_of:
          type: string
          format: date-time
          description: Provenance — observation moment of this row (RFC3339)
          example: '2026-10-12T00:00:00Z'

    RawIngest:
      type: object
      description: One archived external-source response (ADR-022 §2 class A, `ingest.raw`)
      required: [content_hash, source, dataset, key, payload, fetched_at]
      properties:
        content_hash:
          type: string
          description: Canonical sha256 (lowercase hex, 64 chars) of the payload; primary key
        source:
          type: string
          description: Data source that produced the response (e.g. akshare, tushare)
        dataset:
          type: string
          description: Logical dataset name within the source
        key:
          type: string
          description: Source-native key of the record (e.g. instrument + period)
        as_of:
          type: string
          format: date-time
          nullable: true
          description: Point-in-time the data describes (PIT alignment)
        payload:
          type: object
          description: The raw source response, archived verbatim
        fetched_at:
          type: string
          format: date-time
          description: When the response was fetched

    EquityDeepIngestResponse:
      type: object
      description: Outcome of POST /api/ingest/equitydeep
      required: [content_hash, snapshots, rows, dropped]
      properties:
        content_hash:
          type: string
          description: The archived raw response every written row points back to (stored as each row's snapshot_uri)
        snapshots:
          type: integer
          description: Number of ndjson records accepted
        rows:
          type: integer
          description: Number of fundamentals_detail rows written
        dropped:
          type: array
          description: |
            Snapshot fields the normalizer refused to map. Returned rather than
            silently swallowed: a field the contract does not know is a producer
            bug that has to be visible.
          items:
            $ref: '#/components/schemas/EquityDeepDroppedField'

    EquityDeepDroppedField:
      type: object
      description: One snapshot field dropped during normalization
      required: [line, raw_name, reason]
      properties:
        line:
          type: integer
          description: 1-based line number of the snapshot inside the uploaded ndjson
        raw_name:
          type: string
          description: Source field name as it appeared in the snapshot
        reason:
          type: string
          description: Why it was dropped — outside the raw_names whitelist, or not a parseable number

    HealthStatus:
      type: object
      properties:
        status:
          type: string
          example: healthy
        service:
          type: string
          example: analysis-service
        timestamp:
          type: string
          format: date-time

    ApiVersionInfo:
      type: object
      properties:
        service:
          type: string
        version:
          type: string
        endpoints:
          type: array
          items:
            type: string

    OHLCV:
      type: object
      properties:
        symbol:
          type: string
        date:
          type: string
          format: date-time
        open:
          type: number
        high:
          type: number
        low:
          type: number
        close:
          type: number
        volume:
          type: number
        turnover:
          type: number
        trade_days:
          type: integer
        limit_up:
          type: boolean
        limit_down:
          type: boolean

    Signal:
      type: object
      properties:
        symbol:
          type: string
        date:
          type: string
          format: date-time
        direction:
          type: string
          enum: [long, short, close, hold]
        strength:
          type: number
        composite_score:
          type: number
        factors:
          type: object
          additionalProperties:
            type: number
        limit_price:
          type: number
        order_type:
          type: string
          enum: [market, limit, stop, trailing]

    Position:
      type: object
      properties:
        symbol:
          type: string
        quantity:
          type: number
        avg_cost:
          type: number
        current_price:
          type: number
        market_value:
          type: number
        unrealized_pnl:
          type: number
        realized_pnl:
          type: number
        weight:
          type: number
        entry_date:
          type: string
          format: date-time
        buy_date:
          type: string
          format: date-time
        quantity_today:
          type: number
        quantity_yesterday:
          type: number

    Portfolio:
      type: object
      properties:
        cash:
          type: number
        positions:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Position'
        total_value:
          type: number
        daily_return:
          type: number
        updated_at:
          type: string
          format: date-time

    MarketRegime:
      type: object
      properties:
        trend:
          type: string
          enum: [bull, bear, sideways]
        volatility:
          type: string
          enum: [low, medium, high]
        sentiment:
          type: number
          minimum: -1
          maximum: 1
        timestamp:
          type: string
          format: date-time

    StopLossEvent:
      type: object
      properties:
        symbol:
          type: string
        type:
          type: string
          enum: [stop_loss, take_profit]
        price:
          type: number
        quantity:
          type: number
        reason:
          type: string

    BacktestRequest:
      type: object
      required: [strategy, start_date, end_date]
      properties:
        strategy:
          type: string
          example: momentum
        stock_pool:
          type: array
          items:
            type: string
          example: ["000001.SZ", "600000.SH"]
        index_code:
          type: string
          example: "000300.SH"
        start_date:
          type: string
          example: "2024-01-01"
        end_date:
          type: string
          example: "2024-06-01"
        initial_capital:
          type: number
          default: 1000000
        risk_free_rate:
          type: number
          default: 0.03
        kernel:
          type: string
          description: >-
            Kernel routing key (K9/K10). Omitted = default "go" kernel.
            Unknown / unregistered kernels are rejected with 400 (fail-closed,
            no silent fallback — FR-1.3).
          example: go
        market:
          type: string
          description: >-
            Market routing key (D7, hot kernel switching). Declaring a market
            resolves it to a kernel through the configured
            `kernel_routing.markets` table (e.g. CN -> go, US -> nautilus) and
            writes the result into `kernel` before routing — the four frozen
            contracts are untouched by this field. An unregistered market is
            rejected with 400 naming the market and the registered set, never
            silently fallen back to the go kernel (FR-1.3). Omitted = existing
            behaviour (the `kernel` field / the default kernel).
          example: US
        engine_params:
          type: object
          additionalProperties: true
          description: >-
            Engine-specific parameters (K9). Unknown keys are rejected with 400,
            not ignored ("rejected, not ignored"). The go kernel accepts none.

    CreateJobRequest:
      type: object
      required: [strategy_id, universe, start_date, end_date]
      properties:
        strategy_id:
          type: string
        params:
          type: object
          additionalProperties: true
        universe:
          type: string
          example: "000300.SH"
        start_date:
          type: string
        end_date:
          type: string
        initial_capital:
          type: number
        commission_rate:
          type: number
        slippage_rate:
          type: number
        kernel:
          type: string
          description: >-
            Kernel routing key (K10). Omitted = default "go" kernel. The value is
            resolved against the engine registry at execution time: an unregistered
            kernel is accepted here (202) but the job settles as failed with an
            error naming the kernel — no fallback to go.
          example: go
        engine_params:
          type: object
          additionalProperties: true
          description: >-
            Engine-specific parameters (K10). Unknown keys for the target kernel
            are rejected with 400, not ignored.

    BacktestResponse:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        strategy:
          type: string
        start_date:
          type: string
        end_date:
          type: string
        total_return:
          type: number
        annual_return:
          type: number
        sharpe_ratio:
          type: number
        sortino_ratio:
          type: number
        max_drawdown:
          type: number
        max_drawdown_date:
          type: string
        win_rate:
          type: number
        total_trades:
          type: integer
        win_trades:
          type: integer
        lose_trades:
          type: integer
        avg_holding_days:
          type: number
        calmar_ratio:
          type: number
        stock_pool:
          type: array
          items:
            type: string
        initial_capital:
          type: number
        portfolio_values:
          type: array
          items:
            $ref: '#/components/schemas/PortfolioValue'
        trades:
          type: array
          items:
            $ref: '#/components/schemas/Trade'

    BacktestJob:
      type: object
      properties:
        id:
          type: string
        strategy_id:
          type: string
        universe:
          type: string
        start_date:
          type: string
        end_date:
          type: string
        status:
          type: string
          enum: [pending, running, completed, failed]
        result:
          type: object

    PortfolioValue:
      type: object
      properties:
        date:
          type: string
          format: date-time
        total_value:
          type: number
        cash:
          type: number
        positions:
          type: number

    Trade:
      type: object
      properties:
        id:
          type: string
        symbol:
          type: string
        direction:
          type: string
          enum: [long, short, close, hold]
        quantity:
          type: number
        price:
          type: number
        commission:
          type: number
        transfer_fee:
          type: number
        stamp_tax:
          type: number
        timestamp:
          type: string
          format: date-time
        pending_qty:
          type: number
        filled_qty:
          type: number

    WalkForwardRequest:
      type: object
      properties:
        strategy:
          type: string
        stock_pool:
          type: array
          items:
            type: string
        start_date:
          type: string
        end_date:
          type: string
        walk_forward_params:
          type: object
          properties:
            train_days:
              type: integer
              default: 250
            test_days:
              type: integer
              default: 60
            step_days:
              type: integer
              default: 60
            min_train_days:
              type: integer

    WalkForwardReport:
      type: object
      properties:
        strategy_id:
          type: string
        universe:
          type: string
        windows:
          type: array
          items:
            type: object
        avg_test_sharpe:
          type: number
        avg_test_return:
          type: number
        avg_test_max_drawdown:
          type: number
        avg_degradation:
          type: number
        pass_rate:
          type: number
        overall_pass:
          type: boolean

    BatchRunRequest:
      type: object
      required: [tasks]
      properties:
        tasks:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              id:
                type: string
              strategy:
                type: string
              stock_pool:
                type: array
                items:
                  type: string
              start_date:
                type: string
              end_date:
                type: string
              capital:
                type: number
              risk_free_rate:
                type: number
        config:
          type: object
          properties:
            concurrency:
              type: integer
            run_walk_forward:
              type: boolean
            wf_train_days:
              type: integer
            wf_test_days:
              type: integer
            wf_step_days:
              type: integer

    StrategyConfig:
      type: object
      properties:
        id:
          type: integer
        strategy_id:
          type: string
        name:
          type: string
        description:
          type: string
        strategy_type:
          type: string
          enum: [momentum, value, quality, composite]
        params:
          type: string
          description: JSON string of parameters schema.
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateStrategyRequest:
      type: object
      required: [strategy_id, name, strategy_type]
