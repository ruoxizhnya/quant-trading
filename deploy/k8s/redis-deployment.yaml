apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: quant-trading
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: quant-trading
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: quant-trading
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: tcp-redis
              containerPort: 6379
          command: ["redis-server"]
          args: ["--appendonly", "yes"]
          # AUD-39：这里**没有** env，是有意的。此前注入过一个
          # REDIS_PASSWORD（secret redis-credentials），但 command 覆盖了
          # 镜像 entrypoint 且 args 只有 --appendonly —— **没有
          # --requirepass**，redis 根本不校验密码。那个 env 零读取者，只是
          # 让清单看起来有密码保护。给 redis 加密码要动全部服务的
          # REDIS_URL，是另一件事（见 docker-compose.yml 文件头的说明）。
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: quant-trading
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: quant-trading
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: tcp-redis
      port: 6379
      targetPort: 6379
