apiVersion: v1
kind: ConfigMap
metadata:
  name: quant-trading-config
  namespace: quant-trading
  labels:
    app.kubernetes.io/name: quant-trading
    app.kubernetes.io/part-of: quant-trading
data:
  # Service ports (per AGENTS.md service topology)
  ANALYSIS_PORT: "8085"
  DATA_PORT: "8081"
  # AI_PORT 已移除：cmd/ai 于 2026-09-18 删除（TASKS P2-5），它零调用方
  # 且建在待废弃的 pkg/ai/agents 上。AI 能力走 cmd/analysis 的 MCP 工具层。
  # Database (PostgreSQL)
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "quantlab"
  POSTGRES_USER: "quantlab"
  # Cache (Redis)
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  # Logging
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  # Gin mode
  GIN_MODE: "release"
