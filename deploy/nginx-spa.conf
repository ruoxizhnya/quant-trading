# nginx — Vue SPA 托管 + /api 反代（AUD-32）
#
# 这个文件被 Dockerfile.web 放进 /etc/nginx/conf.d/default.conf，
# compose 与 k8s **共用同一份** —— 两边服务名都叫 analysis-service
# （compose 的服务名 / k8s 的 Service 名 + Pod 内的 search domain），
# 所以反代目标写一次就够。

# ── 为什么由 nginx 反代 /api，而不是让前端直连 :8085 ──────────────
# 前端的 API 基址默认是空字符串（web/src/api/client.ts:65 ——
# `import.meta.env.VITE_API_BASE || ''`），所有请求走相对路径 /api/...。
# 由 nginx 反代之后，浏览器看到的仍是同源的 /api/...，**前端一行都不用改**，
# 而且连 CORS 都不用动：SERVER_CORS_ALLOWED_ORIGINS 现在是留空的
# （= 不回显任何 ACAO，最安全的状态），同源请求根本不触发 CORS。
#
# 若改成让前端直连 :8085，就得把 http://<host>:8080 加进白名单 —— 那是把一个
# 「最安全」的默认值换成「有一个源被放行」，只为省一层反代，不划算。

# ── ⚠️ resolver 而不是写死 upstream ────────────────────────────
# 直接写 `proxy_pass http://analysis-service:8085;` 时，nginx 在**启动时**
# 解析一次并把结果缓存到进程退出。两个后果：
#   1. nginx 比 analysis-service 先起来 → upstream 解析失败 → nginx 直接
#      启动失败（compose 里靠 depends_on 缓解，但重启后端换 IP 仍会断）；
#   2. 后端容器重启后 IP 变了，nginx 仍打旧 IP。
# 用变量 + resolver 让它在**每次请求时**解析（缓存 valid=10s）就能避开。
#
# 两个地址覆盖两个环境，nginx 会按顺序尝试：
#   127.0.0.11  — Docker 的内嵌 DNS（compose 自定义网络）
#   10.96.0.10  — k8s CoreDNS 的默认 ClusterIP
# ⚠️ k8s 集群若改过 service CIDR，这个地址要跟着改。

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 10.96.0.10 valid=10s ipv6=off;
    set $backend "analysis-service:8085";

    # 带内容指纹的产物可以长缓存；index.html 必须每次校验，否则发版后
    # 浏览器还拿着旧的外壳，会去请求已经被删掉的旧 assets。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        # ⚠️ 变量形式的 proxy_pass 不会自动补 URI —— 必须显式拼上
        # $request_uri，否则 /api/health 会被打成 http://backend/ ，
        # 后端收到一个裸 "/"。写死域名时 nginx 会自动带 URI，换成变量
        # 就不带了 —— 这正是「两个机制各自对、接起来就错」那一类。
        proxy_pass http://$backend$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── SSE：同步进度用的是 EventSource（web/src/stores/sync.ts:162）──
        # nginx 默认缓冲上游响应，SSE 事件会被攒在缓冲区里不往下发 ——
        # 前端表现是「进度条一动不动，等任务跑完才一次性跳到 100%」。
        # 三件事一起做才有效：
        #   1. proxy_buffering off  —— 收到就转发
        #   2. proxy_read_timeout   —— 数据同步是分钟级，默认 60s 会掐断
        #   3. X-Accel-Buffering: no —— 给**更外层**的中间层看（k8s 里
        #      ingress-nginx 在本机 nginx 之前），只关自己这一层不够。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering "no" always;
    }

    # SPA history 模式（web/src/router 用 createWebHistory）：
    # /backtest、/copilot 这些路径在磁盘上没有对应文件，必须回退到
    # index.html 交给前端路由处理。没有这一行，直接访问深链就是 404。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
