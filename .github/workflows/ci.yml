name: CI

# 项目此前没有任何自动化门禁（见 TASKS P0-2），文档承诺与代码严重脱节。
# 本 workflow 是最小可用门禁：构建 + 静态检查 + 测试 + 文档链接校验。
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  go:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quant_trading
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # 存储层测试需要 Postgres；连不上会 t.Skip，因此这里显式提供服务容器，
      # 让 PIT 等回归测试真正被执行而不是被跳过。
      - name: Test
        run: go test ./... -count=1
        env:
          TUSHARE_TOKEN: ""

  docs:
    name: Doc link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 文档治理规则 R5：文档必须可被自动验证。
      # 默认跳过 archive/（只读历史），只守护常青层与活跃层。
      - name: Check internal doc links
        run: python tools/check_doc_links.py
